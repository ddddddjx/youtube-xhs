ft:3px solid #111}.src{margin-top:14px;font-size:17px;color:#999}</style></head><body><div class="w"><h1>怎么修：<hl>分情况</hl></h1><div class="sub">两个场景，管用的办法不一样</div>
<div class="row"><div class="box"><div class="t">分资源（API 额度）</div><div class="d">加一个<hl>带队的 agent</hl>，按价值排任务<br>Opus 5：30% → 64%<br>再加三条指令 → 71%<br>（总管 agent 是 64%）</div></div>
<div class="box"><div class="t">凑单（外卖 / 订位）</div><div class="d">带队 agent <b>不管用</b><br>改成：<hl>没读完消息就不许下单</hl><br>救回失败局的 73%（Opus 5）<br>和 62%（Sonnet 5）</div></div></div>
<div class="q">作者的结论：多用户、多 agent 的风险，<b>不能简单靠「全交给一个总管」解决</b></div></div></body></html>
