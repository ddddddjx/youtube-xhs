<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#0D1230;font-family:"Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(600px 500px at 85% 80%,rgba(91,140,255,.25),transparent),radial-gradient(500px 400px at 10% 95%,rgba(255,138,61,.18),transparent),linear-gradient(160deg,#0D1230,#1B1340)}
.photo{position:absolute;left:0;top:0;width:1080px;height:940px;background-size:cover;background-position:var(--pos,center);-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,#000 62%,transparent 100%)}
.fade{position:absolute;left:0;top:560px;width:1080px;height:300px;background:linear-gradient(to bottom,rgba(13,18,48,0),#10133A 95%)}
.tag{position:absolute;left:64px;top:56px;padding:12px 26px;border-radius:40px;background:rgba(13,18,48,.78);border:2px solid rgba(255,255,255,.55);color:#F4F1EA;font-size:34px;font-weight:700}
.tag b{color:#F2B84B}
.txt{position:absolute;left:64px;right:64px;top:850px}
.l1{color:#F4F1EA;font-size:104px;font-weight:700;line-height:1.12;letter-spacing:-1px}
.l2{color:#F2B84B;font-size:118px;font-weight:700;line-height:1.12;letter-spacing:-2px;text-shadow:0 0 40px rgba(242,184,75,.35)}
.sub{margin-top:34px;display:flex;gap:18px}
.chip{padding:12px 24px;border-radius:14px;background:rgba(60,200,180,.16);border:2px solid #3CC8B4;color:#F4F1EA;font-size:34px;font-weight:700}
.who{position:absolute;left:64px;bottom:58px;color:#9AA3C7;font-size:30px;font-weight:600}
.chip.g{background:rgba(242,184,75,.14);border-color:#F2B84B}
</style></head><body>
<div class="bg"></div>
<div class="photo" style="background-image:url('PHOTO');--pos:POS"></div>
<div class="tag">Anthropic 官方对谈 · <b>中英字幕</b></div>
<div class="txt">
 <div class="l1">Claude团队：</div>
 <div class="l2">已经不给AI<br>下指令了</div>
 <div class="sub"><div class="chip">只给目标</div><div class="chip g">过程不再盯</div></div>
</div>
<div class="who">Thariq · Sid · Robert　Claude Code 团队三位工程师亲口讲</div>
</body></html>
