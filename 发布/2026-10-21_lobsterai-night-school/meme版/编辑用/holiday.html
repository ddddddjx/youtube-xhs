<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"></head><body><div class="wrap">
<h1>国庆假期，增长最多的还是写代码</h1>
<div class="sub">十一假期 vs 平时，各类任务份额变化（百分点）</div>
<div id="rows"></div>
<div class="note">泛编程 / IT 9 月本来就占全部任务的 <b>40.1%</b>，学生 / 学业只占 3.6%。假期多出来的 4 个点，大概率还是那四成人干的。</div>
<div class="foot">数据：LobsterAI《中国办公 Agent 用户行为报告》9 月版，按原图读数重绘</div>
</div><script>
const d=[['泛编程 / IT',4.0],['学习与教育',1.6],['个人生活事务',1.6],['文档写作',-0.5],['翻译润色',-1.6],['数据与表格',-2.9]];
const M=4.5;let h='';
for(const [n,v] of d){const w=Math.abs(v)/M*50, l=v>=0?50:50-w;
h+=`<div class="row"><span class="n">${n}</span><span class="bar"><i style="left:${l}%;width:${w}%;background:${v>=0?'#1aa36f':'#e8692c'}"></i><i style="left:50%;width:1px;background:#999"></i></span><span class="v" style="color:${v>=0?'#1aa36f':'#e8692c'}">${v>0?'+':''}${v.toFixed(1)}</span></div>`}
document.getElementById('rows').innerHTML=h;
</script></body></html>
