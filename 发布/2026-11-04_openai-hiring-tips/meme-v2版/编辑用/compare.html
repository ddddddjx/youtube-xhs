<html><head><meta charset="utf-8"><style>
body{margin:0;width:970px;background:#fffdf5;font-family:"Noto Sans CJK SC",sans-serif;color:#111}
.w{padding:40px 46px}
h1{font-size:38px;margin:0 0 8px}
.sub{font-size:21px;color:#777;margin-bottom:26px}
.row{display:flex;gap:22px}
.col{flex:1;border:3px solid #111;border-radius:16px;padding:22px 24px;background:#fff}
.tag{display:inline-block;font-size:24px;font-weight:800;padding:4px 14px;border-radius:8px;margin-bottom:18px}
.a .tag{background:#111;color:#fff}.b .tag{background:#FFE600}
.q{font-size:23px;line-height:1.5;margin-bottom:18px}
.en{font-family:Georgia,serif;font-size:19px;color:#555;line-height:1.4;margin:-10px 0 18px}
.a .q{color:#666}
.n{font-size:20px;color:#e62828;font-weight:800;margin-top:6px}
.b .n{color:#111}
hl{background:linear-gradient(transparent 58%,#FFE03D 58%,#FFE03D 92%,transparent 92%)}
</style></head><body><div class="w">
<h1>同一段经历，两种写法</h1>
<div class="sub">例子出自 OpenAI 招聘经理 Wulfie Bain 的简历建议</div>
<div class="row">
<div class="col a"><div class="tag">只写动作</div>
<div class="q">重构了一个 agent</div><div class="en">"Re-architected an agent"</div>
<div class="q">做销售，写跟进了多少客户</div>
<div class="n">看不出值不值得花这个时间</div></div>
<div class="col b"><div class="tag">写交出去了什么、结果是什么</div>
<div class="q">重构后响应<hl>快了 2 秒</hl>，客户满意度随之上升</div>
<div class="q">写带来了<hl>多少收入</hl></div>
<div class="n">一眼看出为什么值得面试</div></div>
</div></div></body></html>
