<html><head><meta charset="utf-8"><style>
body{margin:0;width:970px;background:#fffdf5;font-family:"Noto Sans CJK SC",sans-serif;color:#111}
.w{padding:40px 46px}
h1{font-size:38px;margin:0 0 26px}
.row{display:flex;gap:22px}
.col{flex:1;border:3px solid #111;border-radius:16px;padding:22px 24px;background:#fff}
.tag{display:inline-block;font-size:24px;font-weight:800;padding:4px 14px;border-radius:8px;margin-bottom:14px;background:#FFE600}
.i{display:flex;gap:12px;margin-bottom:16px}
.k{flex:none;width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-weight:800;font-size:20px;text-align:center;line-height:34px}
.t{font-size:23px;font-weight:800;line-height:1.35}
.d{font-size:19px;color:#666;line-height:1.4;margin-top:3px}
.foot{margin-top:22px;font-size:22px;text-align:center}
hl{background:linear-gradient(transparent 58%,#FFE03D 58%,#FFE03D 92%,transparent 92%);font-weight:800}
</style></head><body><div class="w">
<h1>OpenAI 招聘经理的八条建议</h1>
<div class="row">
<div class="col"><div class="tag">简历</div>
<div class="i"><div class="k">1</div><div><div class="t">写短</div><div class="d">最好一页，相关性比页数要紧</div></div></div>
<div class="i"><div class="k">2</div><div><div class="t">删掉不相关的经历</div><div class="d">高中的荣誉通常可以拿掉</div></div></div>
<div class="i"><div class="k">3</div><div><div class="t">写影响，不只写动作</div><div class="d">量化结果；做销售就写收入</div></div></div>
<div class="i"><div class="k">4</div><div><div class="t">方便扫读</div><div class="d">重点加粗，每段经历最强的证据放第一行</div></div></div>
</div>
<div class="col"><div class="tag">面试</div>
<div class="i"><div class="k">1</div><div><div class="t">打磨自我介绍</div><div class="d">唯一确定会被问到的部分，短、贴岗位</div></div></div>
<div class="i"><div class="k">2</div><div><div class="t">先讲全局，再往深挖</div><div class="d">「我先从整体讲，细节随时可以展开」</div></div></div>
<div class="i"><div class="k">3</div><div><div class="t">是对话，不是背稿</div><div class="d">听清问的是什么，例子扣回问题和岗位</div></div></div>
<div class="i"><div class="k">4</div><div><div class="t">表现兴趣</div><div class="d">说你因为读了什么而<b>改变</b>了什么</div></div></div>
</div></div>
<div class="foot">八条背后是一件事：<hl>让对方一眼看到你交出去了什么、结果是什么</hl></div>
</div></body></html>
