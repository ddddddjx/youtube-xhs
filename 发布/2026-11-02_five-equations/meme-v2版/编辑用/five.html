<html><head><meta charset="utf-8"><style>
body{margin:0;width:970px;height:650px;background:#fffdf5;font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;color:#111}
.w{padding:44px 52px}
h1{font-size:40px;margin:0 0 6px}
.sub{color:#777;font-size:22px;margin-bottom:26px}
.r{display:flex;align-items:center;border-top:2px solid #eee;padding:16px 0}
.n{width:54px;height:54px;border-radius:12px;background:#FFE600;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:22px;flex:none}
.t{width:200px;font-size:28px;font-weight:800;flex:none}
.f{width:300px;font-size:21px;color:#444;font-family:"Noto Sans Mono CJK SC",monospace;flex:none}
.q{font-size:23px;color:#111;line-height:1.35}
</style></head><body><div class="w">
<h1>五个公式，各管一类理财说法</h1><div class="sub">看到一个数字，先问它归谁管</div>
<div class="r"><div class="n">1</div><div class="t">复利</div><div class="f">终值 = 本金×(1+r)ⁿ</div><div class="q">「长期持有能翻几倍」</div></div>
<div class="r"><div class="n">2</div><div class="t">72 法则</div><div class="f">翻倍年数 ≈ 72÷r</div><div class="q">「年化 6%」= 12 年翻一倍</div></div>
<div class="r"><div class="n">3</div><div class="t">现值</div><div class="f">现值 = 终值÷(1+r)ⁿ</div><div class="q">保单、养老金、彩票分期</div></div>
<div class="r"><div class="n">4</div><div class="t">几何平均</div><div class="f">(Π(1+rᵢ))^(1/n) − 1</div><div class="q">基金宣传的「平均收益」</div></div>
<div class="r"><div class="n">5</div><div class="t">实际收益</div><div class="f">(1+r)÷(1+通胀) − 1</div><div class="q">「利率 4%」扣掉通胀剩多少</div></div>
</div></body></html>
