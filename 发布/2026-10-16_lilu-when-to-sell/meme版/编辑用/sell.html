<h1>李录会卖的四种情况</h1>
<div class="sub">2024-12-07 北大光华《价值投资》课十周年沙龙，问答环节</div>
<table>
<tr><td class="n">1</td><td class="m">发现自己错了</td><td class="r">马上卖</td></tr>
<tr><td class="n">2</td><td class="m">有更好的标的</td><td class="r">风险回报比更好、下跌空间更小上涨空间更大，就换</td></tr>
<tr class="hi"><td class="n">3</td><td class="m">极端的高估泡沫</td><td class="r">但估值是时间上的概念。真正优秀的公司，因为觉得贵卖了，想买回来时它还是贵，而且已经涨过了你原来估的价值</td></tr>
<tr><td class="n">4</td><td class="m">受托人被迫</td><td class="r">满仓时遇到赎回，又坚持不借债，只能卖一部分</td></tr>

<div class="foot">怎么知道自己的能力圈是真的：股价跌 50% 的那一刻，你还说得出这家公司值多少钱、这一年创造了多少价值吗？<br>比亚迪拿了 22 年，至少七八次跌过 50%，一次跌了 80%；销售额从十亿元涨到近一万亿元。</div>
