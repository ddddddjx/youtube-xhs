<html><head><meta charset="utf-8"><style>body{margin:0;width:970px;background:#fffdf5;font-family:"Noto Sans CJK SC",sans-serif;color:#111}.w{padding:36px 46px}h1{font-size:38px;margin:0 0 8px}.sub{font-size:21px;color:#777;margin-bottom:22px}hl{background:linear-gradient(transparent 58%,#FFE03D 58%,#FFE03D 92%,transparent 92%);font-weight:800}.row{display:flex;gap:18px}.box{flex:1;border:3px solid #111;border-radius:16px;background:#fff;padding:18px 22px}.t{font-size:27px;font-weight:900;margin-bottom:10px;padding-bottom:8px;border-bottom:3px solid #111}.box.no .t{color:#999}.d{font-size:21px;line-height:1.55}.d li{margin-bottom:6px}.why{margin-top:12px;font-size:19px;color:#555;border-top:2px dashed #bbb;padding-top:10px}.q{margin-top:18px;background:#111;color:#fff;border-radius:14px;padding:14px 22px;font-size:21px;line-height:1.5}.q b{color:#FFE600}.flow{display:flex;align-items:center;gap:12px;margin:10px 0}.step{flex:1;border:3px solid #111;border-radius:14px;background:#fff;padding:14px 16px;font-size:21px;line-height:1.4;text-align:center}.step.y{background:#FFE600}.step.g{color:#999;border-color:#999}.arr{font-size:30px;font-weight:900}.lbl{font-size:22px;font-weight:900;margin:14px 0 4px}.big{font-size:60px;font-weight:900;line-height:1.1}.en{font-size:30px;line-height:1.35;font-weight:700;margin:18px 0 10px}.cn{font-size:26px;line-height:1.45;color:#333} .bar{display:flex;height:120px;border:3px solid #111;border-radius:14px;overflow:hidden;margin:16px 0 10px}.bar div{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;border-right:3px solid #111}.bar div:last-child{border-right:0}</style></head><body><div class="w"><h1>第一个评测，<hl>从 5 条提示词开始</hl></h1><div class="sub">评测就是一组固定的题，拿来比两个模型谁做得好</div>
