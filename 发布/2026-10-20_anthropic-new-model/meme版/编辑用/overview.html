<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:480px;background:#fff;font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#171717}
.wrap{padding:16px 20px 18px}
h1{font-size:20px;margin:0 0 3px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.lab{font-size:11px;font-weight:700;color:#e8963a;margin:10px 0 5px;letter-spacing:.5px}
.tl{display:flex;gap:6px}
.node{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:7px 8px;font-size:11.5px;line-height:1.4}
.node b{display:block;font-size:12.5px}
.node.hi{background:#fff7d6;border-color:#f0d27a}
.ev{display:flex;gap:6px}
.card{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:9px 10px;line-height:1.45}
.card .t{font-size:13px;font-weight:700;color:#c0392b;margin-bottom:3px}
.card .q{font-size:11px;color:#444}
.card .ex{font-size:10.5px;color:#777;margin-top:4px}

.concl b{color:#ffd166}
</style></head><body><div class="wrap">
<h1>一图看懂：Anthropic 这款新模型</h1>
<div class="sub">The Information 10 月 19 日爆料，知情人转述，模型还没发布</div>
<div class="lab">这个月排队要发的</div>
<div class="tl">
<div class="node hi"><b>Anthropic</b>新模型，名字和系列都没定</div>
<div class="node"><b>Google</b>Gemini 4 Carbon</div>
<div class="node"><b>OpenAI</b>可能有一款 Terra</div>
</div>
<div class="lab">爆料里 Anthropic 新模型的两个长处</div>
<div class="ev">
<div class="card"><div class="t">① 读意图</div><div class="q">用户没给多少信息，也能猜出背后真正想要什么</div><div class="ex">发帖人：有点发毛，护栏太多了</div></div>
<div class="card"><div class="t">② 不照本宣科</div><div class="q">问怎么买股票，不只让你看市盈率，可能自己琢磨一套预测算法</div><div class="ex">发帖人：这才是进创新者阶段</div></div>
</div>
<div class="concl">我的看法反过来：<b>把活交出去的人，① 比 ② 值钱</b>。返工都是从没听懂开始的。</div>
</div></body></html>
