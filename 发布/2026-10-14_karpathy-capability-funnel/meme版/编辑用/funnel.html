<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:600px;height:405px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:14px 22px}
h1{font-size:19px;margin:0 0 2px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.row{display:flex;align-items:center;margin-bottom:9px}
.bar{height:58px;border-radius:6px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;color:#fff;box-sizing:border-box}
.bar b{font-size:15px;line-height:1.2}
.bar span{font-size:10.5px;opacity:.95;line-height:1.3;margin-top:2px}
.side{font-size:11px;color:#555;margin-left:12px;line-height:1.45;flex:1}
.side b{color:#171717}
.me{display:inline-block;background:#fff0a8;color:#8a5a00;font-size:10px;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:700}
.note{font-size:9.5px;color:#999;margin-top:6px}
</style></head><body><div class="wrap">
<h1>Karpathy 把用 AI 的人分成四层</h1>
<div class="sub">数字是他推文里的粗算（napkin math），2026-10-11，635 万曝光</div>
<div class="row"><div class="bar" style="width:380px;background:#d9d9d9;color:#333"><b>60 亿人 · 75%</b><span>几乎没碰过大模型</span></div><div class="side">地球上四分之三的人</div></div>
<div class="row"><div class="bar" style="width:300px;background:#b5b5b5;color:#222"><b>10 到 20 亿 · 20%</b><span>免费版，当好一点的搜索</span></div><div class="side">觉得是个傻聊天机器人；<b>很多高管和非技术专业人士在这层</b></div></div>
<div class="row"><div class="bar" style="width:200px;background:#e8963a"><b>2000 万 · 0.2%</b><span>用前沿 agent 干专业活</span></div><div class="side"><b>几个月的活一个提示词做完</b><span class="me">我在这层</span><br>我：竞品调研 3 天 → 10 分钟</div></div>
<div class="row"><div class="bar" style="width:110px;background:#171717"><b>5000 人</b><span>实验室内部</span></div><div class="side">几千个 agent 协作几周，<b>人类审查已经跟不上</b></div></div>
<div class="note">漏斗由三样推动：问题够不够大 / 领域能不能验证 / 用的是免费、付费还是内部版</div>
</div></body></html>
