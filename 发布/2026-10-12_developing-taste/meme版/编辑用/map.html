<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:540px;height:270px;background:#fff;font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;color:#171717}
.w{padding:10px 10px 8px;display:flex;gap:10px}
.c{flex:1}
h1{font-size:15px;margin:0 0 7px;font-weight:800}
.lab{font-size:10px;color:#999;margin:0 0 3px;letter-spacing:1px}
.box{border:1.5px solid #e3e3e3;border-radius:7px;padding:4px 7px;font-size:11.5px;line-height:1.35;margin-bottom:3px}
.box b{font-size:12.5px;margin-right:4px}
.dn{color:#ccc;font-size:11px;text-align:center;line-height:1;margin-bottom:3px}
.hot{border-color:#e8963a;background:#fff7ea}
.def{font-size:12px;margin-top:6px}
.def .x{color:#999;text-decoration:line-through}
.def .y{background:#fff0a8;padding:1px 5px;border-radius:4px;font-weight:700}
.t{border-radius:7px;background:#f5f5f5;padding:5px 8px;font-size:11.5px;line-height:1.35;margin-bottom:5px;display:flex;gap:7px;align-items:center}
.t .n{font-size:19px;font-weight:800;color:#e8963a}
.t b{font-size:12.5px;display:block}
.me{border:2px dashed #e8963a;border-radius:7px;padding:5px 8px;font-size:12px;line-height:1.4}
.me i{font-style:normal;color:#e8963a;font-weight:700}
</style></head><body><div class="w">
<div class="c">
<h1>一张图看懂《Developing Taste》</h1>
<div class="lab">为什么品味变重要</div>
<div class="box"><b>汽车刚出来</b>对手是马，没人管颜色</div><div class="dn">↓</div>
<div class="box"><b>满街都是车</b>细节和品质开始值钱</div><div class="dn">↓</div>
<div class="box hot"><b>软件 + AI</b>能用是起步价，差距靠品味</div>
<div class="lab" style="margin-top:7px">品味是什么</div><div class="def" style="margin-top:0"><span class="x">个人喜好</span> → <span class="y">练出来的直觉</span></div>
</div>
<div class="c" style="padding-top:25px">
<div class="lab">怎么练</div>
<div class="t"><span class="n">1</span><span><b>多看</b>找你这行被尊重的人，再看他们欣赏谁</span></div>
<div class="t"><span class="n">2</span><span><b>想为什么</b>别只打好坏，拆它为什么舒服</span></div>
<div class="t"><span class="n">3</span><span><b>动手做</b>找对的人挑毛病，嫌丑说明眼光到了</span></div>
<div class="me"><i>我补一步：</i>说得清的品味，AI 才能照着做</div>
</div>
</div></body></html>
