<!doctype html><html><head><meta charset="utf-8"><style>

<h1>部署鸿沟是什么：一句话</h1>
<div class="sub">原文的例子，今年八月 OpenAI 的一个客户项目</div>
<div class="row"><div class="lab">第一次部署</div><div class="bar" style="width:600px">两个月</div></div>
