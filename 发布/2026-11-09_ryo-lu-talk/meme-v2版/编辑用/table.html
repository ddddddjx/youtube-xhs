<h1>同一句话，交给<hl>服务窗口</hl>还是<hl>工作台</hl></h1><div class="sub">「帮我做一个记下生活的工具」，Ryo Lu 的两个画面</div>
<div class="row">
<div class="box no"><div class="t">服务窗口</div><div class="d"><ul><li>处理完，直接交给你一个新版本</li><li>刚好合适就用</li><li>它拿掉了你喜欢的提醒，你得再解释一次</li><li>面前只有成品：接受、拒绝、再说一次</li></ul></div></div>
<div class="box"><div class="t">工作台</div><div class="d"><ul><li>先看见它打算改什么、删什么</li><li>动手之前就能介入这个计划</li><li>做完用实时预览，自己微调一处</li><li>看到它要删提醒，<b>才发现自己想留</b></li></ul></div></div>
</div>
<div class="q">他给做工具的人三条：<b>让重要的假设看得见</b>；让一次修改小到可以放心试；让交出去的工作，在需要时可以拿回来。</div>
