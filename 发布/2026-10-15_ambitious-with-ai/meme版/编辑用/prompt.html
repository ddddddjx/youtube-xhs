<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;height:600px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:18px 34px}
h1{font-size:34px;margin:0 0 4px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:14px}
.card{background:#171717;color:#fff;border-radius:14px;padding:16px 22px}
.head{font-size:22px;color:#ffb860;font-weight:700;margin-bottom:10px}
.q{display:flex;align-items:flex-start;font-size:22px;line-height:1.4;margin-bottom:8px}
.q .n{width:34px;height:34px;border-radius:50%;background:#e8963a;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:14px;flex:none;font-size:20px}
.tail{font-size:21px;color:#bbb;margin-top:8px;border-top:1px solid #444;padding-top:8px}
</style></head><body><div class="wrap">
<h1>他常用的提示词：要更深，不要更大</h1>
<div class="sub">派活之前，先让 AI 回答这四个问题，再把你的提示词改写一遍</div>
<div class="card">
<div class="head">我要这个任务的更深版本，不是更大的版本。改写之前先告诉我：</div>
<div class="q"><div class="n">1</div><div>这个领域顶尖的人会做什么，是我没要求的</div></div>
<div class="q"><div class="n">2</div><div>他们会从什么最原始的材料开始，而不是整理好的</div></div>
<div class="q"><div class="n">3</div><div>他们会用哪些具体的方法和工具</div></div>
<div class="q"><div class="n">4</div><div>除了你和我，什么能证明结果是对的</div></div>
<div class="tail">然后把我的提示词改写成正好要求这些的版本。</div>
</div>
</div></body></html>
