<!doctype html><html><head><meta charset="utf-8"><style>

<h1>「高度」是什么：同一件活，往上问三级</h1>
<div class="sub">原文的例子，给老板做季度业务汇报</div>
<div class="step s1"><div class="n">1</div><div class="b"><div class="k">派任务</div><div class="q">「按模板把这季度的数填进去」</div></div></div>
<div class="step s2"><div class="n">2</div><div class="b"><div class="k">要结果</div><div class="q">「告诉我这季度变了什么、为什么、该怎么办，再挑出三个最急的决定」</div></div></div>
<div class="step s3"><div class="n">3</div><div class="b"><div class="k">问目的</div><div class="q">「这个会是为了早点发现问题，设计一个比季度汇报更好的办法，用过去的数据证明它更早」</div></div></div>
</div></body></html>
