<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;height:400px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{display:flex;height:400px}
.col{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 36px;box-sizing:border-box}
.l{background:#f1f1f1}
.r{background:#e8963a;color:#fff}
.tag{font-size:26px;font-weight:700;letter-spacing:2px;margin-bottom:18px;opacity:.75}
.big{font-size:44px;font-weight:800;line-height:1.3;margin-bottom:22px}
.q{font-size:27px;line-height:1.45;padding:14px 18px;border-radius:10px}
.l .q{background:#fff;color:#444}
.r .q{background:rgba(255,255,255,.18);color:#fff}
.arrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#171717;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;font-weight:700}
.outer{position:relative}
</style></head><body><div class="outer"><div class="wrap">
<div class="col l"><div class="tag">我以前这么派活</div><div class="big">派任务</div><div class="q">「帮我把这季度的数填进 PPT」</div></div>
<div class="col r"><div class="tag">他说该这么派</div><div class="big">要结果</div><div class="q">「告诉我这季度变了什么、为什么、该怎么办」</div></div>
</div><div class="arrow">→</div></div></body></html>
