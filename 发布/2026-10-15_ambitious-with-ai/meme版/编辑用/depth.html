<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;height:600px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:18px 34px}
h1{font-size:34px;margin:0 0 4px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:16px}
.row{display:flex;align-items:center;margin-bottom:12px}
.lab{width:190px;font-size:22px;font-weight:700}
.bar{height:50px;border-radius:8px;display:flex;align-items:center;padding-left:16px;font-size:22px;font-weight:700;color:#fff;box-sizing:border-box}
.tag{margin-left:14px;font-size:20px;color:#666}
.r1 .bar{width:640px;background:#c9c9c9}
.r2 .bar{width:320px;background:#e8b26a}
.r3 .bar{width:34px;background:#e8963a;padding-left:0}
.r3 .tag{color:#e8963a;font-weight:700}
.foot{margin-top:14px;font-size:21px;color:#444;border-top:2px dashed #ddd;padding-top:12px}
.foot b{color:#171717}
</style></head><body><div class="wrap">
<h1>「深度」是什么：定一个不讲理的目标</h1>
<div class="sub">原文的例子，网站加载时间</div>
<div class="row r1"><div class="lab">现在</div><div class="bar">10 秒</div></div>
<div class="row r2"><div class="lab">你觉得合理</div><div class="bar">5 秒</div><div class="tag">这就是它的天花板</div></div>
<div class="row r3"><div class="lab">他要的</div><div class="bar"></div><div class="tag">200 毫秒，模型说做不到？告诉它完全能做到</div></div>
<div class="foot">你给它的目标有多「合理」，它就只能做到多「合理」。<b>短板不是模型，是派活的人。</b></div>
</div></body></html>
