<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;height:600px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:18px 34px}
h1{font-size:34px;margin:0 0 4px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:14px}
.flow{display:flex;align-items:stretch;gap:0}
.box{border-radius:12px;padding:14px 16px;box-sizing:border-box}
.k{font-size:19px;color:#888;margin-bottom:6px}
.v{font-size:22px;line-height:1.4;font-weight:700}
.b1{width:200px;background:#f1f1f1}
.b2{width:330px;background:#fff3e0}
.b3{width:300px;background:#ffe9c7}
.arr{width:46px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#e8963a;font-weight:800}
.v small{display:block;font-size:19px;font-weight:400;color:#555;margin-top:4px}
.foot{margin-top:16px;font-size:21px;color:#444;border-top:2px dashed #ddd;padding-top:12px;line-height:1.45}
.foot b{color:#171717}
</style></head><body><div class="wrap">
<h1>「广度」是什么：名词换成动词，再想叫谁</h1>
<div class="sub">原文的例子，给老板做季度业务汇报</div>
<div class="flow">
<div class="box b1"><div class="k">名词</div><div class="v">季度业务汇报</div></div>
<div class="arr">→</div>
<div class="box b2"><div class="k">动词</div><div class="v">让一群忙人在 30 分钟里相信一个因果故事，然后做决定</div></div>
<div class="arr">→</div>
<div class="box b3"><div class="k">叫谁来</div><div class="v">讲得清楚<small>分析师、记者、编辑</small></div><div class="v" style="margin-top:8px">经得起挑刺<small>做空的、法务会计</small></div></div>
</div>
<div class="foot">让 AI <b>做那个人会做的事</b>，不是扮演那个人：不是写做空报告，是做做空的人会做的研究。</div>
</div></body></html>
