<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:480px;background:#fff;font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#171717}
.wrap{padding:16px 20px 18px}
h1{font-size:20px;margin:0 0 3px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.step{display:flex;align-items:flex-start;border:1px solid #e6e6e6;border-radius:8px;padding:8px 10px;margin-bottom:4px}
.step.hi{background:#fff7d6;border-color:#f0d27a}
.n{width:24px;font-weight:700;color:#e8963a;font-size:16px;flex:none}
.t{font-weight:700;font-size:13px;width:140px;flex:none}
.d{font-size:11.5px;color:#444;line-height:1.5}
.arrow{text-align:center;color:#bbb;font-size:12px;line-height:12px;margin:0 0 4px}
.foot{font-size:11.5px;color:#555;margin-top:10px;line-height:1.55;border-left:3px solid #e8963a;padding-left:8px}
</style></head><body><div class="wrap">
<h1>SayType：按住说话，松开就是整理好的字</h1>
<div class="sub">我的 Mac mini 上跑的 v0.1，2026-10-17</div>
<div class="step"><div class="n">1</div><div class="t">按住右 ⌥ 录音</div><div class="d">任何输入框都行，菜单栏图标变红；按不到 0.3 秒算误触</div></div>
<div class="arrow">▼</div>
<div class="step"><div class="n">2</div><div class="t">本地 SenseVoice 识别</div><div class="d">不联网、不花钱；5.6 秒的中文录音 0.24 秒认完，粤语、中英混说也能认</div></div>
<div class="arrow">▼</div>
<div class="step hi"><div class="n">3</div><div class="t">DeepSeek 整理</div><div class="d">删掉「嗯、那个」，说错改口的只留后一句，按个人词库纠正人名，补标点</div></div>
<div class="arrow">▼</div>
<div class="step"><div class="n">4</div><div class="t">自动粘贴到光标</div><div class="d">写进剪贴板、模拟 ⌘V，再把原来的剪贴板还回去</div></div>
<div class="foot">Typeless 卖的就是第 3 步：你说的是口语，它打出来的是你本来想写的那段字。</div>
</div></body></html>
