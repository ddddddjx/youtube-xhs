<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:30px 40px 30px}
h1{font-size:34px;margin:0 0 6px;font-weight:700}
.sub{font-size:20px;color:#888;margin-bottom:22px}
.bar{display:flex;height:64px;border-radius:12px;overflow:hidden;font-size:24px;font-weight:700;margin-bottom:10px}
.bar div{display:flex;align-items:center;justify-content:center}
.a{width:10%;background:#c0251f;color:#fff}.b{width:90%;background:#eee;color:#555}
.note{font-size:20px;color:#666;margin-bottom:30px}
.row{display:flex;align-items:center;gap:18px;margin:14px 0}
.box{flex:1;border-radius:12px;padding:18px 22px;font-size:25px;font-weight:700;text-align:center}
.now{background:#f3f3f3;color:#333}.later{background:#fff1f0;color:#c0251f;border:3px solid #c0251f}
.arr{font-size:22px;color:#c0251f;font-weight:700;width:120px;text-align:center;line-height:1.2}
.foot{font-size:20px;color:#888;margin-top:20px}
</style></head><body><div class="wrap">
<h1>2019 年 GPT-2 出来时，Dario 身边的人</h1>
<div class="sub">原话：大概 10% 和我反应一样，往往是最聪明的那几个</div>
<div class="bar"><div class="a">10%</div><div class="b">90%：单看哪一项都不怎么样，耸耸肩走了</div></div>
<div class="note">吓到的人看的是「什么都能做一点」，耸肩的人看的是「哪一项都不够好」</div>
<h1 style="font-size:30px">2026 年，他说同样的事还在每个行业重演</h1>
<div class="row"><div class="box now">现在看起来难的事</div><div class="arr">6 个月后<br>→</div><div class="box later">变得容易</div></div>
<div class="row"><div class="box now">现在看起来不可能的事</div><div class="arr">12 个月后<br>→</div><div class="box later">模型例行公事地做</div></div>
<div class="foot">来源：Walter Isaacson《The Builders》对谈 Dario、Daniela Amodei</div>
</div></body></html>
