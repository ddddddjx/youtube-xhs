<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:480px;background:#fff;font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#171717}
.wrap{padding:16px 20px 18px}
h1{font-size:20px;margin:0 0 3px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.step{display:flex;align-items:flex-start;border:1px solid #e6e6e6;border-radius:8px;padding:9px 10px;margin-bottom:6px}
.step.hi{background:#fff7d6;border-color:#f0d27a}
.n{width:24px;font-weight:700;color:#e8963a;font-size:16px;flex:none}
.t{font-weight:700;font-size:13px;width:150px;flex:none}
.d{font-size:11.5px;color:#444;line-height:1.5}
.up{color:#1f8a4c}.down{color:#c0392b}
.foot{font-size:11.5px;color:#555;margin-top:10px;line-height:1.55;border-left:3px solid #e8963a;padding-left:8px}
</style></head><body><div class="wrap">
<h1>瓶颈挪了：干活交出去，人卡在看活</h1>
<div class="sub">Anthropic 内部报告，员工和自己派出去的 agent</div>
<div class="step"><div class="n">1</div><div class="t">干活的是 agent</div><div class="d">8 月，员工派出去的 agent 工作时长是员工的 6 倍</div></div>
<div class="step"><div class="n">2</div><div class="t">agent 在等人</div><div class="d">Claude 的对话里，大约 80% 的时间在等人回复</div></div>
<div class="step hi"><div class="n">3</div><div class="t">人读不过来</div><div class="d">不写代码的员工，光读一遍 agent 的产出就要半周工时</div></div>
<div class="foot">活越快，人的注意力越不够用。新的活变成了管活：写指令、搭看板、让一个 agent 审另一个。</div>
</div></body></html>
