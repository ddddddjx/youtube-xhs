<h1>约束<small>Constraints</small></h1>
<div class=q>什么在限制可能的方案？</div>
<div class=intro>先把边界找出来：资源、物理规律、时间、成本和需求。<hl>它们决定了什么做得到</hl>。</div>
<div class=body><div class=row style="align-items:center">
 <div style="width:450px"><div class="box b" style="margin-bottom:12px"><div class=lab>问题</div><div style="font-size:34px;font-weight:900;line-height:1.35">为崎岖地形设计<br>一台野外机器人</div></div>
 <img src="crops/dog.png" style="width:440px;border-radius:18px"></div>
 <div style="flex:1;display:flex;flex-direction:column;gap:10px"><div class=lab>约束条件</div>
 <div class="box o" style="padding:12px 20px"><div class=t style="font-size:26px">功率</div><div class=d>≤ 300 W，续航 ≥ 2 小时</div></div><div class="box b" style="padding:12px 20px"><div class=t style="font-size:26px">重量</div><div class=d>≤ 20 kg，一个人搬得动</div></div><div class="box g" style="padding:12px 20px"><div class=t style="font-size:26px">成本</div><div class=d>每台 ≤ 5000 美元</div></div><div class="box p" style="padding:12px 20px"><div class=t style="font-size:26px">环境</div><div class=d>−10 到 50 °C，防尘防雨</div></div><div class="box v" style="padding:12px 20px"><div class=t style="font-size:26px">时间</div><div class=d>8 周内做出原型</div></div></div></div>
