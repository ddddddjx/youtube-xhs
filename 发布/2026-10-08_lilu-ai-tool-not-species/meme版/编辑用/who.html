<h1>李录是谁</h1>
<ul>
<li><b>1966</b> 年生于唐山，哥伦比亚大学六年三个学位（经济学、法学博士、MBA）</li>
<li><b>1997</b> 年创办喜马拉雅资本，按格雷厄姆、巴菲特、芒格那套做全球价值投资</li>
<li>查理·芒格的合伙人。芒格说他一辈子把家族的钱交给外人管，只有李录一例</li>
<li>向巴菲特推荐了<b>比亚迪</b>，伯克希尔 2008 年投进去，成了巴菲特最成功的投资之一</li>
<li>写过《文明、现代化、价值投资与中国》，芒格作序</li>
</ul>
<div class="foot">公开资料整理。这场对谈是哥大商学院第 36 届 Graham &amp; Dodd 论坛，官方活动页确认嘉宾是他。</div>
