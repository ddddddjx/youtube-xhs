<h1>同一个台上，两种担心</h1>
<div class="sub">IMF 年会 Per Jacobsson 讲座，曼谷，10 月 17 日</div>
<div class="cols">
<div class="col"><div class="who">Jack Clark</div><div class="role">Anthropic 联合创始人</div><div class="q">AI 会让整个科学加速，快到人很难跟上。每个科学家以后能带几百上千个「虚拟科学家」干活。</div></div>
<div class="col hi"><div class="who">印度首席经济顾问</div><div class="role">讨论嘉宾</div><div class="q">新人第一级台阶在被抽掉。真正的风险不是机器开始思考，是我们不再思考。</div></div>
</div>
<div class="foot">一个讲 AI 会变得多强，一个讲人会不会变懒。放在一起看，问题是同一个：判断还在不在人手里。</div>
</div></body></html>
