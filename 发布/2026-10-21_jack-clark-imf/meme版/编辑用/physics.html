<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:480px;background:#fff;font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#171717}
.wrap{padding:16px 20px 18px}
h1{font-size:20px;margin:0 0 3px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.step{display:flex;align-items:flex-start;border:1px solid #e6e6e6;border-radius:8px;padding:9px 10px;margin-bottom:6px}
.step.hi{background:#fff7d6;border-color:#f0d27a}
.n{width:24px;font-weight:700;color:#e8963a;font-size:16px;flex:none}
.t{font-weight:700;font-size:13px;width:130px;flex:none}
.d{font-size:11.5px;color:#444;line-height:1.5}
.cols{display:flex;gap:8px}.col{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:10px}
.col.hi{background:#fff7d6;border-color:#f0d27a}
.who{font-weight:700;font-size:13px;margin-bottom:2px}.role{font-size:10.5px;color:#888;margin-bottom:6px}
.q{font-size:12px;line-height:1.55;color:#333}
.foot{font-size:11.5px;color:#555;margin-top:10px;line-height:1.55;border-left:3px solid #e8963a;padding-left:8px}
</style></head><body><div class="wrap">
<h1>学生改了老师的作业：50 道物理题</h1>
<div class="sub">Jack Clark 讲的上周一篇论文，题目全是物理学家自己没发表的研究</div>
<div class="step"><div class="n">1</div><div class="t">专家出题</div><div class="d">各国物理学家拿自己没发表的研究出了 50 道题，答案网上搜不到</div></div>
<div class="step"><div class="n">2</div><div class="t">AI 不认答案</div><div class="d">初评 80 多分，模型坚持自己是对的，说专家给的答案有错</div></div>
<div class="step hi"><div class="n">3</div><div class="t">专家回去查</div><div class="d">好几道题，专家真在自己的计算深处找到了小错，改了答案</div></div>
<div class="step"><div class="n">4</div><div class="t">49 / 50</div><div class="d">答案改完，同一个模型的分数一路往上爬，最后只错一道</div></div>
<div class="foot">出题的人本来是裁判，这次裁判被选手纠正了。但也是裁判愿意回去重算，这件事才成立。</div>
</div></body></html>
