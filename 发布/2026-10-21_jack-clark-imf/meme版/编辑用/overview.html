<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:480px;background:#fff;font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#171717}
.wrap{padding:16px 20px 18px}
h1{font-size:20px;margin:0 0 3px;font-weight:700}
.sub{font-size:10.5px;color:#888;margin-bottom:12px}
.lab{font-size:11px;font-weight:700;color:#e8963a;margin:10px 0 5px;letter-spacing:.5px}
.tl{display:flex;align-items:center;gap:4px}
.node{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:7px 8px;font-size:11.5px;line-height:1.4}
.node b{display:block;font-size:12.5px}
.node.hi{background:#fff7d6;border-color:#f0d27a}
.arr{color:#e8963a;font-weight:700}
.ev{display:flex;gap:6px}
.card{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:8px;text-align:center}
.big{font-size:19px;font-weight:700;color:#c0392b;line-height:1.2}
.small{font-size:10.5px;color:#555;line-height:1.4;margin-top:3px}
.concl{margin-top:6px;background:#171717;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.concl b{color:#ffd166}
.con{border:1px dashed #c0392b;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;color:#333}
</style></head><body><div class="wrap">
<h1>一图看懂：Jack Clark 在 IMF 讲了什么</h1>
<div class="sub">IMF / 世界银行年会 Per Jacobsson 讲座，曼谷，10 月 17 日</div>
<div class="lab">他是谁</div>
<div class="tl">
<div class="node"><b>科技记者</b>二十年前写数据中心</div><div class="arr">→</div>
<div class="node"><b>OpenAI</b>2016 年辞职加入</div><div class="arr">→</div>
<div class="node hi"><b>Anthropic</b>联合创始人</div>
</div>
<div class="lab">他拿出的三个证据</div>
<div class="ev">
<div class="card"><div class="big">49 / 50</div><div class="small">没发表的理论物理题，还挑出了专家答案里的错</div></div>
<div class="card"><div class="big">8%→67.7%</div><div class="small">「人类最后的考试」，不到两年</div></div>
<div class="card"><div class="big">2%→94%</div><div class="small">数学家出的难题集</div></div>
</div>
<div class="concl">他的结论：<b>奇点已经来了</b>，加速的不只是 AI，是整个科学。</div>
<div class="lab">台上的反方</div>
<div class="con">印度首席经济顾问：新人的第一级台阶在被抽掉；真正的风险不是机器开始思考，是我们不再思考。</div>
</div></body></html>
