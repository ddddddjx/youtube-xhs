<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}

<h1>同一类功能，我做了两次</h1>
<div class="sub">一个带定位的社交组件，两次之间隔了「把整件事交给 AI」这一年</div>
<div class="cols">
<div class="col a"><div class="tag">当年公司 Hackathon</div><div class="big">10 个人 × 1 周</div><div class="li">前端、后端、测试、设计<br>十个校招生<br>带 GPS 定位的约会功能<br>那次赢了</div></div>
<div class="col b"><div class="tag">前天晚上</div><div class="big">1 个人 × 1 晚</div><div class="li">同一类组件<br>Claude / Codex 写，我拍板<br>MVP 上线<br>没有团队</div></div>
</div>
<div class="foot">Andreessen 说的差距以周为单位拉开，落到一个人身上，就是这两格之间的距离。</div>
