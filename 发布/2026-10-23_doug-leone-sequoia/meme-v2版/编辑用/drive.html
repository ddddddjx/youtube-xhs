<!doctype html><html><head><meta charset="utf-8"><style>

<h1>领先几十年，靠什么撑着</h1>
<div class="sub">左边是 Doug Leone 的答案，右边是我的</div>
<div class="cols">
<div class="col a"><div class="tag">Doug Leone · 69 岁</div><div class="big">恐惧</div><div class="li">怕被淘汰、怕消失<br>每次重塑自己都因为这个<br>回来 90 天：「我一无是处」<br>一年不行就自己退场</div></div>
<div class="col b"><div class="tag">我 · 用 AI 两年</div><div class="big">好奇</div><div class="li">每个新模型、新工具都想试一遍<br>想知道答案，才做得完每天的工作<br>探索欲变成原动力<br>撑得住几十年的是这个</div></div>
</div>
<div class="foot">恐惧能让人动起来，撑不了几十年；靠害怕做不完每天的工作。</div>
