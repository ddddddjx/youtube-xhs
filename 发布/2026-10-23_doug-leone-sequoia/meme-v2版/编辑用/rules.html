<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:30px 40px 24px}
h1{font-size:34px;margin:0 0 6px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:22px}
.cols{display:flex;gap:20px}
.col{flex:1;border-radius:10px;padding:18px 22px;box-sizing:border-box}
.a{background:#f3f3f3}.b{background:#fff7d6}
.tag{font-size:19px;color:#888;font-weight:600;margin-bottom:8px}
.big{font-size:40px;font-weight:800;line-height:1.2;margin-bottom:10px}.b .big{color:#e8963a}
.li{font-size:21px;line-height:1.6;color:#333}
.foot{font-size:21px;color:#555;line-height:1.5;margin-top:18px}
</style></head><body><div class="wrap">
<h1>投资人的三条准则，产业里的人反着用</h1>
<div class="sub">左边是 Doug Leone 的原话，右边是我给自己定的</div>
<div class="cols">
<div class="col a"><div class="tag">投资人 · Doug Leone</div><div class="big">一生只投 20 个</div><div class="li">① 会不会把孩子的钱投进去<br>② 一生只投 20 个，这是不是其中之一<br>③ 这一笔能不能赚回整只基金<br>三条都过不了，就不投</div></div>
<div class="col b"><div class="tag">产业里的人 · 我</div><div class="big">一年做 200 个</div><div class="li">① 每天做一个，持续试错<br>② 做到有一个爆掉为止<br>③ 一个人配一组 agent，产量顶过去一个团队<br>机会不是挑出来的，是做出来的</div></div>
</div>
<div class="foot">他的机会有限，所以精挑细选；我的成本接近零，所以不停折腾。</div>
</div></body></html>
