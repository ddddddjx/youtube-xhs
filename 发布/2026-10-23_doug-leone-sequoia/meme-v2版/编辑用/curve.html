<h1>学 AI 的成长曲线：我在哪一段</h1>

<svg width="880" height="420" viewBox="0 0 880 420">
  <line x1="60" y1="370" x2="860" y2="370" stroke="#999" stroke-width="2"/>
  <line x1="60" y1="370" x2="60" y2="30" stroke="#999" stroke-width="2"/>
  <text x="840" y="400" font-size="20" fill="#777" text-anchor="end">用 AI 的时间</text>
  <text x="70" y="45" font-size="20" fill="#777">觉得自己懂多少</text>
  <path d="M 80 330 C 180 330, 220 120, 330 100 C 400 90, 430 150, 500 240 C 560 320, 640 300, 840 120" fill="none" stroke="#e8963a" stroke-width="7" stroke-linecap="round"/>

  <circle cx="330" cy="100" r="13" fill="#c0251f"/>

  <text x="640" y="330" font-size="18" fill="#bbb">?</text>

<div class="foot">Doug Leone 69 岁回红杉，说自己「一无是处」，大概是又一次从左下角重新开始。</div>
