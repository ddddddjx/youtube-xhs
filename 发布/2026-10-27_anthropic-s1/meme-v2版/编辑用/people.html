<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:30px 40px 24px}
h1{font-size:34px;margin:0 0 6px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{border-radius:10px;padding:16px 20px;background:#f3f3f3}
.cell.hot{background:#fff1f0}
.lab{font-size:19px;color:#888;font-weight:600}
.row{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.old{font-size:28px;color:#999;text-decoration:line-through}
.arr{font-size:24px;color:#aaa}
.new{font-size:44px;font-weight:800;color:#171717}.hot .new{color:#c0251f}
.x{font-size:20px;color:#777;margin-top:2px}
.foot{font-size:21px;color:#555;line-height:1.5;margin-top:16px}
</style></head><body><div class="wrap">
<h1>人只多了不到六倍，产出涨了几十倍</h1>
<div class="sub">左列是 2024 年，右列是 2026 年 9 月，都是招股书里的数</div>
<div class="grid">
<div class="cell"><div class="lab">员工人数</div><div class="row"><span class="old">940</span><span class="arr">→</span><span class="new">5300</span></div><div class="x">不到 6 倍</div></div>
<div class="cell"><div class="lab">人均收入（过去 12 个月）</div><div class="row"><span class="old">140 万</span><span class="arr">→</span><span class="new">660 万美元</span></div><div class="x">4.7 倍</div></div>
<div class="cell hot"><div class="lab">代码库提交由 Claude 写成</div><div class="row"><span class="new">90% 以上</span></div><div class="x">2026 年 9 月</div></div>
<div class="cell hot"><div class="lab">每位工程师日均代码量</div><div class="row"><span class="old">1</span><span class="arr">→</span><span class="new">45 倍以上</span></div><div class="x">对比 2024 年全年</div></div>
</div>
<div class="foot">5300 个人，每个人背后一组 agent。按人头估算产能的方式，在这家公司已经失效。</div>
</div></body></html>
