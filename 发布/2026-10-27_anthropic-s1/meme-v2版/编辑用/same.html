<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:960px;background:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#171717}
.wrap{padding:30px 40px 24px}
h1{font-size:34px;margin:0 0 6px;font-weight:700}
.sub{font-size:19px;color:#888;margin-bottom:22px}
.cols{display:flex;gap:20px}
.col{flex:1;border-radius:10px;padding:18px 22px;box-sizing:border-box}
.a{background:#f3f3f3}.b{background:#fff1f0}
.tag{font-size:19px;color:#888;font-weight:600;margin-bottom:8px}
.big{font-size:36px;font-weight:800;line-height:1.2;margin-bottom:10px}.b .big{color:#c0251f}

.foot{font-size:21px;color:#555;line-height:1.5;margin-top:18px}
</style></head><body><div class="wrap">
<h1>五千人的公司和一个人的工作室，同一道难题</h1>
<div class="sub">左边是招股书风险因素里写的，右边是我自己碰到的</div>
<div class="cols">
<div class="col a"><div class="tag">Anthropic · 5300 人</div><div class="big">「可能失去可见性」</div><div class="li">① 九成以上代码由 Claude 写<br>② 研究、安全研究也越来越多交给它<br>③ 监控「并不覆盖所有内部和外部部署」<br>④ 任何个人或一群人都难以理解和控制</div></div>
<div class="col b"><div class="tag">我 · 一个人加一组 agent</div><div class="big">几天没盯，bug 漏过去</div><div class="li">① 工作交给 agent 之后做了很多看板<br>② 看板和监控都是做给人看的<br>③ 人的精力有限，几天没看<br>④ 看板停了更新都没发现</div></div>
</div>
<div class="foot">产出的速度超过了人看懂它的速度。招股书把它写成风险，我把它记成代价。</div>
</div></body></html>
