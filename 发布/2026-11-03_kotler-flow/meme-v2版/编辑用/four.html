<h1>进入心流的四个条件</h1>
<div class="c"><div class="n">1</div><div><div class="t">难度：比能力高一点点</div><div class="d">Kotler 给的数是 4%（粗略估算）。目标太大就切小：500 字太难，就写 300 字。</div></div></div>
<div class="c"><div class="n">2</div><div><div class="t">打断：只留一个紧急通道</div><div class="d">高管被打断的渠道从 20 年前约 3 种涨到 17–18 种；消息集中在早上和傍晚处理。</div></div></div>
<div class="c"><div class="n">3</div><div><div class="t">时长：一次 90 分钟</div><div class="d">清醒专注周期跟睡眠周期一样，90–110 分钟一轮；只能专注 10 分钟，就从 10 分钟练起。</div></div></div>
<div class="c ai"><div class="n">4</div><div><div class="t">卡住：先别急着交给 AI</div><div class="d">沮丧说明工作记忆装满了，是心流的第一段。<span class="x">一卡住就问 AI，这一段就被跳过了。</span></div></div></div>
</div></body></html>
